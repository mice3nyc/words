<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>words</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" href="favicon.svg">
<style>
  @import url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --font: 'Paperlogy', 'Pretendard', -apple-system, sans-serif;
    --black: #1100ff;
    --grey: #1100ff;
    --light: #1100ff;
    --accent: #1100ff;
    --bg: #fff;
    --max-w: 1200px;
    --read-w: 640px;
  }

  body {
    font-family: var(--font);
    color: var(--black);
    background: var(--bg);
    line-height: 1.75;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    padding: 3rem 2rem 2rem;
    max-width: var(--max-w);
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .site-title {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: lowercase;
    cursor: pointer;
    color: var(--black);
    text-decoration: none;
  }

  .site-title:hover { color: var(--accent); }

  .header-nav {
    font-size: 0.75rem;
    color: var(--grey);
    letter-spacing: 0.05em;
  }

  /* ── List View ── */
  .list-view {
    max-width: var(--read-w);
    margin: 0 auto;
    padding: 2rem;
  }

  .post-item {
    padding: 1.5rem 0;
    border-bottom: 1px dashed var(--light);
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .post-item:hover { opacity: 0.6; }

  .post-item:last-child { border-bottom: none; }

  .post-title {
    font-size: 1.15rem;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 0.2rem;
  }

  .post-title-en {
    font-size: 0.8rem;
    color: var(--grey);
    font-weight: 400;
    margin-bottom: 0.3rem;
  }

  .post-subtitle {
    font-size: 0.85rem;
    color: var(--grey);
    margin-bottom: 0.3rem;
  }

  .post-date {
    font-size: 0.75rem;
    color: var(--grey);
    letter-spacing: 0.05em;
  }

  /* ── Post View ── */
  .post-view {
    display: none;
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 2rem 4rem;
  }

  .post-header {
    max-width: var(--read-w);
    margin: 0 auto 2.5rem;
  }

  .post-header h2 {
    font-size: 1.6rem;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 0.2rem;
  }

  .post-header .title-en {
    font-size: 0.95rem;
    color: var(--grey);
    font-weight: 400;
    margin-bottom: 0.5rem;
  }

  .post-header .subtitle {
    font-size: 0.9rem;
    color: var(--grey);
    margin-bottom: 0.5rem;
  }

  .post-header .date {
    font-size: 0.75rem;
    color: var(--grey);
    letter-spacing: 0.05em;
  }

  .post-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    max-width: var(--read-w);
    margin-left: auto;
    margin-right: auto;
    font-size: 0.75rem;
    color: var(--grey);
  }

  .post-nav a {
    color: var(--grey);
    text-decoration: none;
    cursor: pointer;
    letter-spacing: 0.03em;
  }

  .post-nav a:hover { color: var(--accent); }

  .post-nav .nav-disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  /* ── Bilingual Layout ── */
  .bilingual {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    max-width: var(--max-w);
    margin: 0 auto;
  }

  .bilingual.vertical {
    grid-template-columns: 1fr;
    max-width: var(--read-w);
  }

  .bilingual.vertical .col-en {
    border-top: 1px dashed var(--light);
    padding-top: 2rem;
    margin-top: 1rem;
  }

  .col-kr, .col-en {
    font-size: 0.95rem;
    line-height: 1.85;
  }

  .col-en {
    color: #444;
  }

  /* Images: show in left column only (side-by-side), both in stacked */
  .col-en img { display: none; }
  .bilingual.en-first .col-en img { display: block; }
  .bilingual.en-first .col-kr img { display: none; }
  .bilingual.vertical .col-en img { display: block; }
  .bilingual.vertical .col-kr img { display: block; }

  .col-kr h2, .col-en h2 {
    font-size: 1.5rem;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 0.3rem;
  }

  .col-subtitle {
    font-size: 0.85rem;
    color: var(--grey);
    margin-bottom: 0.2rem;
  }

  .col-date {
    font-size: 0.7rem;
    color: var(--grey);
    letter-spacing: 0.05em;
    margin-bottom: 1.5rem;
  }

  .col-kr p, .col-en p {
    margin-bottom: 1.2rem;
  }

  .col-kr strong, .col-en strong {
    font-weight: 600;
  }

  .col-kr img, .col-en img {
    max-width: 100%;
    margin: 1rem 0;
    border-radius: 2px;
  }

  .lang-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--grey);
    margin-bottom: 1rem;
    font-weight: 500;
  }

  /* ── Language Order ── */
  .bilingual.en-first .col-kr { order: 2; }
  .bilingual.en-first .col-en { order: 1; }

  /* ── Control Buttons ── */
  .controls {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    z-index: 100;
  }

  .ctrl-btn {
    height: 28px;
    padding: 0 0.65rem;
    border: none;
    border-radius: 14px;
    background: var(--grey);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: var(--font);
    font-size: 0.6rem;
    font-weight: 500;
    color: #fff;
    letter-spacing: 0.05em;
  }

  .ctrl-btn:hover {
    background: var(--accent);
  }

  /* ── Footer ── */
  footer {
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 3rem 2rem;
    font-size: 0.7rem;
    color: var(--light);
    text-align: center;
    letter-spacing: 0.05em;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    header { padding: 2rem 1.2rem 1.5rem; }
    .list-view { padding: 1rem 1.2rem; }
    .post-view { padding: 0 1.2rem 3rem; }
    .bilingual {
      grid-template-columns: 1fr;
      max-width: var(--read-w);
    }
    .bilingual .col-en {
      border-top: 1px dashed var(--light);
      padding-top: 2rem;
      margin-top: 1rem;
    }
  }

  /* ===== 뮤지엄 레이아웃 v2: 전체폭 상단바 + 3영역 독립 스크롤 ===== */
  body { background: #fff; overflow: hidden; }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px; z-index: 100;
    background: #fff; border-bottom: 1px dashed var(--light);
    display: flex; align-items: center; gap: 1.5rem; padding: 0 2rem 0 2.2rem;
  }
  .topbar .site-title { font-size: 1rem; flex-shrink: 0; }
  .topbar .top-title {
    flex: 1; min-width: 0; text-align: center;
    font-size: 0.95rem; font-weight: 600; color: var(--black);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar .top-right { display: flex; align-items: center; gap: 0.9rem; flex-shrink: 0; }
  .top-btn {
    border: 1px dashed var(--light); background: #fff; border-radius: 13px;
    padding: 0.25rem 0.65rem; font-size: 0.62rem; color: var(--grey); cursor: pointer;
    font-family: var(--font); letter-spacing: 0.05em; height: 26px;
  }
  .top-btn:hover { color: var(--accent); border-color: var(--accent); }
  .topbar .post-nav {
    position: static; display: flex; gap: 0.9rem; margin: 0; padding: 0;
    max-width: none; font-size: 0.75rem; justify-content: flex-end;
  }

  .below {
    position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: 240px 1fr;
  }
  .sidebar {
    overflow-y: auto; height: 100%;
    padding: 2rem 1.8rem 2rem 2.2rem;
    border-right: 1px dashed var(--light);
  }
  .sidebar-nav { display: flex; flex-direction: column; gap: 1rem; }
  .side-item { font-size: 0.82rem; line-height: 1.4; color: var(--grey); cursor: pointer; transition: color 0.15s; }
  .side-item:hover { color: var(--black); }
  .side-item.active { color: var(--black); font-weight: 700; }   /* 선택 글 = 검정 볼드 */
  .side-item .si-date { display: block; font-size: 0.62rem; color: #1100ff; letter-spacing: 0.05em; margin-top: 0.15rem; }

  .app-main { overflow: hidden; height: 100%; display: flex; flex-direction: column; padding: 0 6rem 0 3rem; }
  .app-main .list-view { max-width: 560px; overflow-y: auto; height: 100%; padding: 1.8rem 0; margin: 0; }
  .app-main .post-view { flex: 1; display: flex; flex-direction: column; min-height: 0; max-width: none; margin: 0; padding: 0; }
  .app-main .bilingual {
    flex: 1; min-height: 0; max-width: none; margin: 0;
    grid-template-columns: 1fr 1fr; gap: 0;
  }
  .app-main .bilingual .col-kr { overflow-y: auto; height: 100%; padding: 1.8rem 2.5rem 2rem 0; }
  .app-main .bilingual .col-en { overflow-y: auto; height: 100%; padding: 1.8rem 0 2rem 2.5rem; border-left: 1px dashed var(--light); }
  .app-main .bilingual .col-kr h2, .app-main .bilingual .col-en h2 { display: none; }  /* 제목은 상단바에 */
  .col-kr a, .col-en a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); }

  /* 모바일: 상하 적층, 독립 스크롤 해제 */
  @media (max-width: 900px) {
    body { overflow: auto; }
    .below { position: static; display: block; }
    .sidebar { display: none; }
    .app-main { display: block; height: auto; overflow: visible; padding: 70px 1.2rem 3rem; }
    .app-main .bilingual { display: block; }
    .app-main .bilingual .col-kr, .app-main .bilingual .col-en { overflow: visible; height: auto; padding: 0; border-left: none; }
    .app-main .bilingual .col-en { border-top: 1px dashed var(--light); padding-top: 2rem; margin-top: 1rem; }
  }

  /* 상단바: 컬럼 기준 좌정렬 + 큰 타이틀 + 영문 타이틀 */
  .topbar { height: 60px; display: grid; grid-template-columns: 240px 1fr; gap: 0; padding: 0; align-items: stretch; }
  .topbar .site-title { align-self: center; padding-left: 2.2rem; }
  .top-main { display: flex; align-items: center; gap: 1.5rem; padding: 0 6rem 0 3rem; min-width: 0; }
  .top-main .top-title { flex: 1; min-width: 0; text-align: left; display: flex; align-items: baseline; gap: 0.6rem; overflow: hidden; }
  .top-title .tt-kr { font-size: 1.3rem; font-weight: 600; white-space: nowrap; }
  .top-title .tt-en { font-size: 0.82rem; color: var(--grey); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-main .top-right { display: flex; align-items: center; gap: 0.9rem; flex-shrink: 0; }
  .below { top: 60px; }

  /* 본문 크기 1rem 버전 */
  .col-kr, .col-en { font-size: 1rem; }

  /* 로열블루를 눈에 보이게: 상단 네비 + 사이드바 호버 + 사이트 타이틀 */
  .topbar .post-nav a { color: var(--accent); }
  .topbar .post-nav a:hover { color: #1100ff; }      /* 호버 시 더 진한 네이비 */
  .side-item:hover { color: var(--accent); }          /* 마우스 올린 글 = 파랑 */
  .topbar .site-title { color: var(--accent); }       /* 사이트 타이틀 파랑 포인트 */

  /* 전체 파랑 통일: 남은 비-파랑 텍스트 마무리 */
  .col-en { color: #1100ff; }
  .side-item .si-date { color: #1100ff; }
  body { color: var(--black); }

  /* 한영 본문 숨틈: 좌우 마진 확대 */
  .app-main { padding-left: 4rem; padding-right: 7rem; }
  .app-main .bilingual .col-kr { padding-right: 3.5rem; }
  .app-main .bilingual .col-en { padding-left: 3.5rem; }

  /* 강조색 #ff2500: 선택된 스토리(현재 글) */
  .side-item.active { color: #ff2500; }
</style>
</head>
<body>

<!-- Top Bar (전체폭 고정) -->
<div class="topbar">
  <a class="site-title" onclick="showList()">words.of.peter.</a>
  <div class="top-main">
    <div class="top-title" id="topTitle"></div>
    <div class="top-right">
      <button class="top-btn" id="langBtn" title="언어 순서 전환" onclick="toggleLang()"><span id="langLabel">ko → en</span></button>
      <button class="top-btn" id="flipBtn" title="레이아웃 전환" onclick="toggleLayout()"><span id="flipLabel">↔</span></button>
      <div class="post-nav" id="postNav"></div>
    </div>
  </div>
</div>

<!-- Below: 좌목록 | 본문 -->
<div class="below">
  <aside class="sidebar">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <main class="app-main">
    <main class="list-view" id="listView"></main>
    <article class="post-view" id="postView">
      <div class="post-header" id="postHeader" style="display:none"></div>
      <div class="bilingual" id="bilingualContent"></div>
    </article>
  </main>
</div>

<script>
// ── Data (loaded from JSON) ──
let POSTS = [];
let currentPost = null;
let isVertical = window.innerWidth <= 768;
let isEnFirst = false;

// ── Init ──
fetch('posts.json')
  .then(r => r.json())
  .then(data => {
    POSTS = data.sort((a, b) => new Date(b.date) - new Date(a.date));
    renderList();
    renderSidebar();
    const __first = POSTS.filter(p => p.visible)[0];
    if (__first) showPost(__first.id);
  });



// ── Render ──
function renderList() {
  const el = document.getElementById('listView');
  const visible = POSTS.filter(p => p.visible);
  el.innerHTML = visible.map(p => `
    <div class="post-item" onclick="showPost('${p.id}')">
      <div class="post-title">${p.title}</div>
      ${p.title_en ? `<div class="post-title-en">${p.title_en}</div>` : ''}
      <div class="post-date">${p.date}</div>
    </div>
  `).join('');
}

function renderSidebar(currentId) {
  const nav = document.getElementById('sidebarNav');
  if (!nav) return;
  const visible = POSTS.filter(p => p.visible);
  nav.innerHTML = visible.map(p => `
    <div class="side-item ${p.id === currentId ? 'active' : ''}" onclick="showPost('${p.id}')">
      ${p.title}
      <span class="si-date">${p.date}</span>
    </div>
  `).join('');
}

function renderPost(post) {
  document.getElementById('topTitle').innerHTML =
    `<span class="tt-kr">${post.title}</span>` +
    (post.title_en ? `<span class="tt-en">${post.title_en}</span>` : '');

  const krHtml = paragraphs(post.content_kr);
  const enHtml = paragraphs(post.content_en);

  document.getElementById('bilingualContent').innerHTML = `
    <div class="col-kr">
      <h2>${post.title}</h2>
      ${post.subtitle ? `<div class="col-subtitle">${post.subtitle}</div>` : ''}
      <div class="col-date">${post.date}</div>
      ${krHtml}
    </div>
    <div class="col-en">
      <h2>${post.title_en || post.title}</h2>
      ${post.subtitle_en || post.subtitle ? `<div class="col-subtitle">${post.subtitle_en || post.subtitle}</div>` : ''}
      <div class="col-date">${post.date}</div>
      ${enHtml}
    </div>
  `;

  updateLayout();
}

function paragraphs(text) {
  if (!text) return '<p></p>';
  return text.trim().split('\n\n').map(p => {
    p = p.trim();
    if (!p) return '';
    // Skip horizontal rules
    if (p === '---' || p === '- - -') return '';
    // Image
    const imgMatch = p.match(/^!\[([^\]]*)\]\(([^)]+)\)/);
    if (imgMatch) {
      return `<img src="${imgMatch[2]}" alt="${imgMatch[1]}">`;
    }
    // Bold-only paragraph
    if (p.startsWith('**') && p.endsWith('**')) {
      return `<p><strong>${p.slice(2, -2)}</strong></p>`;
    }
    // Inline bold + images within text
    p = p.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
    p = p.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    p = p.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    // Within a single block, line breaks become <br> (poem-style stanzas)
    p = p.replace(/\n/g, '<br>');
    return `<p>${p}</p>`;
  }).join('');
}

// ── Navigation ──
function showList() {
  document.getElementById('listView').style.display = 'block';
  document.getElementById('postView').style.display = 'none';
  document.getElementById('controls').style.display = 'none';
  currentPost = null;
  const tt = document.getElementById('topTitle'); if (tt) tt.innerHTML = '';
  renderSidebar();
  window.scrollTo(0, 0);
}

function showPost(id) {
  fetch(`posts/${id}.json`)
    .then(r => r.json())
    .then(post => {
      currentPost = post;
      renderPost(post);
      renderNav(id);
      renderSidebar(id);
      document.getElementById('listView').style.display = 'none';
      document.getElementById('postView').style.display = 'flex';
      document.getElementById('controls').style.display = 'flex';
      window.scrollTo(0, 0);
    });
}

function renderNav(currentId) {
  const visible = POSTS.filter(p => p.visible);
  const idx = visible.findIndex(p => p.id === currentId);
  const prev = idx > 0 ? visible[idx - 1] : null;
  const next = idx < visible.length - 1 ? visible[idx + 1] : null;

  document.getElementById('postNav').innerHTML = `
    ${prev ? `<a onclick="showPost('${prev.id}')">← prev</a>` : '<span></span>'}
    <a onclick="showList()">index</a>
    ${next ? `<a onclick="showPost('${next.id}')">next →</a>` : '<span></span>'}
  `;
}

// ── Layout Toggle ──
function toggleLayout() {
  isVertical = !isVertical;
  updateLayout();
}

function toggleLang() {
  isEnFirst = !isEnFirst;
  updateLayout();
}

function updateLayout() {
  const el = document.getElementById('bilingualContent');
  const flipLabel = document.getElementById('flipLabel');
  const langLabel = document.getElementById('langLabel');

  if (isVertical) {
    el.classList.add('vertical');
    flipLabel.textContent = '↕';
  } else {
    el.classList.remove('vertical');
    flipLabel.textContent = '↔';
  }

  if (isEnFirst) {
    el.classList.add('en-first');
    langLabel.textContent = 'en → ko';
  } else {
    el.classList.remove('en-first');
    langLabel.textContent = 'ko → en';
  }
}

window.addEventListener('resize', () => {
  if (window.innerWidth <= 768 && !isVertical) {
    isVertical = true;
    if (currentPost) updateLayout();
  }
});
</script>

</body>
</html>
